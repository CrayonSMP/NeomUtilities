# The Duralki configs.
duralki:
  # The CraftEngine Item ID.
  item-id: "neom:duralki"
  # How much durability will transfer per tick?
  transferrate: 20
  # Sounds - self explanatory.
  break-sound: "miecraft:entity.item.break"
  transfer-sound: "minecraft:block.amethyst_block.chime"
  replace-sound: "minecraft:block.end_portal_frame.fill"
  # Blacklist of items that will not be drillable (Minecraft and CraftEngine Item IDs).
  blacklisted-tools: [
    "neom:gauntlet"
  ]
  replace-tools:
    "neom:gauntlet": "minecraft:diamond_pickaxe"


# The Gauntlet configs.
gauntlet:
  # The CraftEngine Item ID.
  item-id: "neom:gauntlet"
  # The Mana recharge period in ticks.
  mana-recharge-period: 20
  # The amount of mana recharge per period.
  mana-per-period: 1
  # The amount of mana consumed per break.
  mana-consume: 5
  # The amount of mana capacity lost at default.
  default-mana-capacity-los: 10
  # The amount of mana capacity lost per break.
  mana-capacity-los-per-break: 0.1
  # The cooldown in seconds for the mana regen after breaking a block.
  cooldown: 10
  # The blocks that can be drilled.
  drillable-blocks:
    - "miecraft:stone"
    - "minecraft:cobblestone"
    - "minecraft:tuff"
    - "minecraft:infested_stone"
    - "minecraft:granite"
    - "minecraft:diorite"
    - "minecraft:andesite"

# The Biom changer configs.
biomchanger:
  # First the CraftEngine Item ID second the biom id.
  items:
    "custom:item":
      biom: "minecraft:jungle"
      radius: 15
      removeItems: true
      players:
        - "bfd59ae0-c905-4f3b-903a-3ce8510d6b71"
    "custom:item2":
      biom: "minecraft:jungle"
      radius: 15
      removeItems: true
      players:
        - "bfd59ae0-c905-4f3b-903a-3ce8510d6b71"

#
# All actions: change_block, remove_block, spawn, particle, sound
# All change_block types: block, customblock, furniture
# All spawn types: vanilla, mythicmob
#

hatchableblocks:
  "neom:carved_acacia_planks":
    stagesize: 3
    points:
      '1':
        time: 30
        actions:
          - type: change_block
            value:
              type: customblock
              id: neom:carved_dark_oak_planks
          - type: sound
            value:
              key: minecraft:block.amethyst_block.break
              volume: 1
              pitch: 1
      '2':
        time: 60
        actions:
          - type: change_block
            conditions:
              - type: "is-block"
                inverted: false
                terms:
                  type: customblock
                  id: "neom:carved_bamboo_planks"
                  x: ~
                  y: ~-1
                  z: ~
            value:
              type: vanilla
              id: $rarity$
          - type: sound
            value:
              key: minecraft:block.amethyst_block.break
              volume: 1
              pitch: 1
      '3':
        time: 90
        actions:
          - type: remove_block
            value:
              type: customblock
          - type: sound
            value:
              key: minecraft:block.amethyst_block.break
              volume: 1
              pitch: 1
          - type: spawn
            value:
              type: mythicmob
              entity: ExampleMob
              random_rotation: true
          - type: particle
            value:
              id: 'minecraft:block{block_state:"craftengine:custom_0"}'
              count: 100
              offset-x: 0.3
              offset-y: 0.3
              offset-z: 0.3
              speed: 0.02
              centered: true

variables:
  # Der Name der Variable (wird über $rarity$ aufgerufen)
  rarity:
    type: "string"
    options:
      # Die Keys (COMMON, RARE, EPIC) sind die Werte, die zurückgegeben werden
      "minecraft:stone":
        probability: 0.7
      "minecraft:diamond_block":
        probability: 0.15
      "minecraft:tuff":
        probability: 0.05
      "minecraft:iron_block":
        probability: 0.1

entity-model-mapping:
  COPPER_GOLEM:
    default: "copper_golem_fresh"
    unaffected: "copper_golem_fresh"
    exposed: "copper_golem_exposed"
    weathered: "copper_golem_weathered"
    oxidized: "copper_golem_oxidized"

trait-sequencer:
  block-id: "neom:trait-sequencer"
  faild-item: "neom:biomatrics"
  inv-name: "Trait Sequencer"
  tiers:
    0:
      Display: "Deactivated"
      id: "minecraft:barrier"
    1:
      Display: "Tier 1"
      id: "craftengine:xyz"
    2:
      Display: "Tier 2"
      id: "craftengine:xyz"
    3:
      Display: "Tier 3"
      id: "craftengine:xyz"
  #Modifier settings.
  #Unter der custom lore kommt automatisch die Tier.
  modifiers:
    Structural:
      Display: "§6Structural Density"
      lore: "§7Die physische Härte und Explosionsresistenz."
    Morphological:
      Display: "§6Morphological Phase"
      lore: "§7Die Form, Textur oder kristalline Struktur der Oberfläche."
    Climatic:
      Display: "§6Climatic Affinity"
      lore: "§7Das Klima oder das Biom, zu dem das Item gehört."
    Organic:
      Display: "§6Organic Vitality"
      lore: "§7Die Menge an biometrischen Strukturen im Block."
    Energy:
      Display: "§6Energy Resonance"
      lore: "§7Wie der Block mit Energie, Magie oder Licht interagiert."
    Kinetic:
      Display: "§6Kinetic Behavior"
      lore: "§7Wie der Block auf Schwerkraft oder Reibung reagiert."
    Botanical:
      Display: "§6Botanical Propagation"
      lore: "§7Bestimmt, ob das neue item Potenzial für zum beispiel Früchte hat."
  # All Sequnecer Recipies
  # Modifier Types: Structural, Morphological, Climatic, Organic, Energy, Kinetic, Botanical
  recipes:
    - id: "reinforced_obsidian" # Interne ID zur Identifizierung
      input:
        material: "minecraft:OBSIDIAN"
        amount: 1
      result:
        material: "minecraft:CRYING_OBSIDIAN"
        amount: 1
        name: "<#7f00ff>Reinforced Obsidian" # Optionaler Custom Name
      modifiers:
        - type: "Structural"
          tier: 3
          input: "minecraft:NETHERITE_SCRAP"
        - type: "Energy"
          tier: 1
          input: "minecraft:GLOWSTONE_DUST"

    - id: "tropical_growth"
      input:
        material: "minecraft:OAK_SAPLING"
        amount: 1
      result:
        material: "minecraft:JUNGLE_SAPLING"
        amount: 1
      modifiers:
        - type: "Climatic"
          tier: 2
          input: "minecraft:SAND"
        - type: "Botanical"
          tier: 2
          input: "minecraft:MELON_SLICE"